<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Owl · Dating for night workers</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Night Owl: dating for people who work while the world sleeps.">
<meta name="theme-color" content="#0A0918">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0A0918; --bg2:#07061A; --card:#15132B; --card2:#1E1B3A; --line:#2A2652; --line2:#3A3570;
  --text:#F3F1FF; --muted:#A9A3CC; --soft:#CFCAEE;
  --moon:#FFD27A; --pink:#FF5C8A; --pink2:#FF7FA3; --good:#5FE3B0; --bad:#FF7A7A; --violet:#9D8CFF;
  --head:Sora,system-ui,sans-serif; --body:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#231C52 0%,transparent 60%),radial-gradient(900px 500px at -10% 10%,#1A1440 0%,transparent 55%),var(--bg);background-attachment:fixed}
a{color:var(--moon);text-decoration:none}a:hover{color:#FFE2A6}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 104px}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:12px}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.soft{color:var(--soft)}.small{font-size:13px}.tiny{font-size:12px}
.h1{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.5px;margin:0}
.h2{font-family:var(--head);font-weight:700;font-size:20px;margin:0}
.kicker{font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.moon{color:var(--moon)}.pink{color:var(--pink)}
.logo{font-family:var(--head);font-weight:800;font-size:22px;display:flex;align-items:center;gap:8px;color:var(--text);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.btn{min-height:46px;padding:0 18px;border-radius:23px;border:1px solid var(--line2);background:transparent;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.p{background:linear-gradient(135deg,var(--pink),#FF8A6B);border-color:transparent;color:#fff;font-weight:700}
.btn.m{background:var(--moon);border-color:var(--moon);color:#1A1530;font-weight:700}
.btn.block{width:100%}.btn.big{min-height:52px;font-size:16px}
.btn:active,.chip:active,.cbtn:active{transform:scale(.96)}
.chip{font-size:13px;font-weight:600;padding:7px 12px;border-radius:14px;background:var(--card2);color:var(--soft);border:1px solid transparent;display:inline-flex;gap:6px;align-items:center}
button.chip,label.chip{min-height:38px;cursor:pointer}
.chip.on,.chip:has(input:checked){background:rgba(255,210,122,.16);border-color:var(--moon);color:var(--moon)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
input.f,textarea.f,select.f{width:100%;min-height:46px;padding:11px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-size:15px}
textarea.f{min-height:90px;resize:vertical}
label.l{font-size:13px;font-weight:600;color:var(--soft);display:block;margin-bottom:6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--soft);line-height:1.45}
.check input{width:22px;height:22px;flex-shrink:0;accent-color:var(--pink);margin:0}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.ibtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;position:relative;color:var(--text);flex-shrink:0}
.dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:5px;background:var(--pink)}
.pill{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--card);border-radius:23px;padding:4px;border:1px solid var(--line)}
.pill button{height:40px;border-radius:19px;border:0;background:transparent;font-weight:600}
.pill button.on{background:var(--text);color:var(--bg);font-weight:700}
.hero{border-radius:28px;padding:28px 20px;background:linear-gradient(160deg,#2A1F6B 0%,#1A1440 55%,rgba(21,19,43,.6) 100%);border:1px solid var(--line2);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 20%,#fff9 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 60%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 40% 75%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 10% 85%,#fff5 50%,transparent 51%),radial-gradient(1.2px 1.2px at 60% 50%,#fff6 50%,transparent 51%);pointer-events:none}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;font-size:12px;color:var(--soft);display:flex;flex-direction:column;gap:6px}
.feat b{font-size:13px;color:var(--text)}
/* swipe deck */
.deck{position:relative;height:calc(100vh - 250px);min-height:440px;max-height:640px}
.pcard{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:var(--card2);box-shadow:0 18px 40px rgba(0,0,0,.45);touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform}
.pcard.behind{transform:scale(.95) translateY(10px);opacity:.7}
.pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:2}
.bars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}.bars span.on{background:#fff}
.pinfo{position:absolute;left:0;right:0;bottom:0;padding:70px 18px 18px;background:linear-gradient(180deg,transparent 0%,rgba(7,6,26,.75) 40%,rgba(7,6,26,.96) 100%);z-index:2}
.pname{font-family:var(--head);font-size:30px;font-weight:800;letter-spacing:-.5px}
.stamp{position:absolute;top:34px;z-index:3;font-family:var(--head);font-weight:800;font-size:30px;padding:6px 14px;border-radius:12px;border:4px solid;opacity:0;transform:rotate(-14deg)}
.stamp.like{left:22px;color:var(--good);border-color:var(--good)}.stamp.nope{right:22px;color:var(--bad);border-color:var(--bad);transform:rotate(14deg)}
.cbtns{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:16px}
.cbtn{width:62px;height:62px;border-radius:31px;border:1px solid var(--line2);background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.cbtn.sm{width:48px;height:48px}.cbtn.nope{color:var(--bad)}.cbtn.like{color:#fff;background:linear-gradient(135deg,var(--pink),#FF8A6B);border-color:transparent;width:70px;height:70px;border-radius:35px}.cbtn.info{color:var(--violet)}.cbtn.undo{color:var(--moon)}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;background:rgba(255,210,122,.18);color:var(--moon);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.badge.g{background:rgba(95,227,176,.16);color:var(--good)}.badge.v{background:rgba(157,140,255,.18);color:#C9BFFF}
.pulse{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--good);animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.3}}
.av{width:56px;height:56px;border-radius:28px;object-fit:cover;background:var(--card2);flex-shrink:0;border:2px solid var(--line2)}
.av.sm{width:40px;height:40px}.av.lg{width:96px;height:96px;border-radius:48px;border-width:3px;border-color:var(--moon)}
.newm{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.newm::-webkit-scrollbar{display:none}
.newm a{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text);font-size:12px;font-weight:600;width:72px;flex-shrink:0}
.newm img{width:68px;height:68px;border-radius:34px;object-fit:cover;border:2px solid var(--pink)}
.crow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);color:var(--text)}
.msg{display:flex}.msg.me{justify-content:flex-end}
.bub{max-width:78%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--card2);line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg.me .bub{border-radius:18px 18px 6px 18px;background:linear-gradient(135deg,var(--pink),#FF8A6B);color:#fff}
.compose{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:84px;background:var(--bg);padding:10px 0}
.compose textarea{min-height:46px;height:46px;border-radius:23px;padding:12px 16px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pslot{aspect-ratio:3/4;border-radius:14px;background:var(--card2);border:2px dashed var(--line2);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pslot img{width:100%;height:100%;object-fit:cover}
.pslot .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:15px;background:rgba(7,6,26,.8);border:0;color:#fff;display:flex;align-items:center;justify-content:center}
.pslot .main{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;background:var(--moon);color:#1A1530;padding:2px 8px;border-radius:10px}
nav.bar{position:fixed;left:0;right:0;bottom:0;height:calc(72px + env(safe-area-inset-bottom));padding:6px 8px calc(12px + env(safe-area-inset-bottom));background:rgba(7,6,26,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));z-index:20}
nav.bar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);position:relative}
nav.bar a.on{color:var(--moon);font-weight:700}
nav.bar a .dot{top:4px;right:calc(50% - 18px)}
.sheet-bg{position:fixed;inset:0;background:rgba(3,2,12,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto;border-top:1px solid var(--line2)}
.match{position:fixed;inset:0;z-index:60;background:radial-gradient(600px 400px at 50% 30%,#4A1D5C 0%,#140F33 60%,#07061A 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
.match .pair{display:flex}.match .pair img{width:120px;height:120px;border-radius:60px;object-fit:cover;border:4px solid var(--moon)}.match .pair img+img{margin-left:-24px;border-color:var(--pink)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:22px;font-weight:600;z-index:80;max-width:90vw;text-align:center}
.empty{border:1px dashed var(--line2);border-radius:18px;padding:22px;text-align:center;color:var(--muted);line-height:1.5}
.sk{border-radius:20px;background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px;font-size:18px;text-align:center}
@media (prefers-reduced-motion:reduce){.pulse,.sk{animation:none}}
@media (min-width:900px){nav.bar{left:50%;transform:translateX(-50%);max-width:520px;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}}

/* owl mascot */
.owl .shut{opacity:0}.owl .eye .open{transform-box:fill-box;transform-origin:center}
.owl.wink .eye.r .open{opacity:0}.owl.wink .eye.r .shut{opacity:1}
.owl.sleep .eye .open{opacity:0}.owl.sleep .eye .shut{opacity:1}
.owl.blinky .eye .open{animation:blink 6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.hero.fly{padding-top:230px;background:linear-gradient(180deg,rgba(10,9,24,0) 30%,rgba(10,9,24,.88) 62%,#0F0C26 100%),url(/owl-fly.jpg) 42% 0/cover no-repeat,#140F0C}
.hero.fly:before{display:none}
.react{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
.react .peek{position:absolute;right:0;top:30%;width:200px;animation:peek 1.05s cubic-bezier(.3,1.3,.5,1) forwards;transform-origin:100% 50%}
.react .peek img{width:200px;height:200px;display:block;filter:drop-shadow(0 10px 30px #0009)}
.react .bub2{position:absolute;left:-46px;top:-20px;background:#fff;color:#0A0918;font:800 15px var(--head);padding:8px 13px;border-radius:16px 16px 4px 16px;white-space:nowrap;opacity:0;animation:bub 1.05s ease-out forwards}
@keyframes peek{0%{transform:translateX(105%) rotate(0)}22%{transform:translateX(22%) rotate(-8deg)}45%{transform:translateX(22%) rotate(-28deg)}75%{transform:translateX(22%) rotate(-28deg)}100%{transform:translateX(105%) rotate(-10deg)}}
@keyframes bub{0%,25%{opacity:0;transform:scale(.6)}35%,78%{opacity:1;transform:scale(1)}100%{opacity:0}}
.react .hrt{position:absolute;color:var(--pink);opacity:0;animation:float 1s ease-out forwards}.react .hrt svg{fill:currentColor}
.react .a{right:150px;top:40%;animation-delay:.25s}.react .b{right:190px;top:46%;animation-delay:.35s}.react .c{right:120px;top:34%;animation-delay:.45s}
@keyframes float{0%{transform:translateY(10px) scale(.5);opacity:0}30%{opacity:1}100%{transform:translateY(-60px) scale(1.15);opacity:0}}
.react.no{animation:lights 1.1s ease-in-out forwards;display:flex;align-items:center;justify-content:center}
@keyframes lights{0%{background:rgba(0,0,0,0)}18%,86%{background:rgba(0,0,0,.94)}100%{background:rgba(0,0,0,0)}}
.react .eyeball{width:min(86vw,420px);aspect-ratio:640/668;animation:eyein 1.1s ease-in-out forwards}
.react .eyeball img{width:100%;height:100%;display:block;-webkit-mask-image:radial-gradient(circle at 56% 44%,#000 14%,transparent 38%);mask-image:radial-gradient(circle at 56% 44%,#000 14%,transparent 38%);animation:shut 1.1s ease-in-out forwards}
@keyframes eyein{0%{opacity:0;transform:scale(.92)}25%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0}}
@keyframes shut{0%,48%{clip-path:inset(0 0 0 0)}62%,100%{clip-path:inset(43% 0 55% 0)}}
@media (prefers-reduced-motion:reduce){.owl.blinky .eye .open,.react,.react *{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="sk" style="height:520px"></div></div>
<nav class="bar" id="nav" aria-label="Main" hidden></nav>
<script src="/app.js?v=__VERSION__"></script>
</body>
</html>
